name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check version sync
        run: |
          manifest_ver=$(python -c "import json;print(json.load(open('custom_components/xiaodu_bridge/manifest.json'))['version'])")
          pyproject_ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$manifest_ver" = "$pyproject_ver" || { echo "version drift: manifest=$manifest_ver pyproject=$pyproject_ver"; exit 1; }
      - name: Run ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff check custom_components/xiaodu_bridge/

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-homeassistant-custom-component
      - name: Run tests
        run: python -m pytest tests/ -q
