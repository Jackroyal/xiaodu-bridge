[project]
name = "home-assistant-xiaodu-bridge"
version = "0.9.9"
description = "Home Assistant custom integration: xiaodu bridge"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-homeassistant-custom-component>=0.13.0",
  "homeassistant>=2025.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# HA 级测试依赖 pytest-asyncio 自动模式处理 async 测试/fixture（phacc 要求）
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
